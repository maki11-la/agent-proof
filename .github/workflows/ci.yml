name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Repository proof
        run: agent-proof run proof.yaml
      - name: Quickstart example
        run: agent-proof run examples/quickstart/proof.yaml
      - name: Tiny-app example
        run: agent-proof run examples/tiny-app/proof.yaml --json

  install:
    name: clean install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install into a fresh virtualenv
        run: |
          python -m venv /tmp/agent-proof-venv
          /tmp/agent-proof-venv/bin/python -m pip install --upgrade pip
          /tmp/agent-proof-venv/bin/python -m pip install .
          /tmp/agent-proof-venv/bin/agent-proof --version
          /tmp/agent-proof-venv/bin/agent-proof run proof.yaml
          /tmp/agent-proof-venv/bin/agent-proof run examples/quickstart/proof.yaml
          /tmp/agent-proof-venv/bin/agent-proof run examples/tiny-app/proof.yaml
