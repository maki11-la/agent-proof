version: 1
name: agent-proof repository
description: Gate for this repository. Run `agent-proof` from the repo root.
root: .
checks:
  - name: readme exists and states the pitch
    type: file
    path: README.md
    exists: true
    min_bytes: 400
    contains: "Agent Proof"
    matches: "pipx install"

  - name: license is MIT
    type: file
    path: LICENSE
    contains: "MIT License"

  - name: contributing guide is present
    type: file
    path: CONTRIBUTING.md
    min_bytes: 200
    contains: "Agent Proof"

  - name: scratch file was not left behind
    type: file
    path: scratch.tmp
    exists: false

  - name: package modules are present
    type: file
    glob: src/agent_proof/*.py
    min_matches: 5

  - name: console script is declared
    type: file
    path: pyproject.toml
    contains: 'agent-proof = "agent_proof.cli:main"'

  - name: sponsors file names the maintainer
    type: yaml
    path: .github/FUNDING.yml
    equals:
      github: maki11-la

  - name: quickstart example is present
    type: file
    path: examples/quickstart/proof.yaml
    contains: "name: quickstart"

  - name: tiny-app example is present
    type: file
    path: examples/tiny-app/proof.yaml
    contains: "name: tiny-app"

  - name: python runs
    type: command
    run: [python3, -c, "print('agent-proof-ok')"]
    timeout: 15
    stdout_contains: agent-proof-ok
